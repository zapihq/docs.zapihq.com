name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A deploy is a sequence of remote mutations; never cancel one halfway.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.17.0"
  IMAGE_REPOSITORY: ghcr.io/zapihq/docs.zapihq.com
  SSH_OPTIONS: "-i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts"

jobs:
  ci:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Publishing lives in its own reusable workflow so the image pipeline can
  # change without touching the deploy. The call is gated on the checks and
  # exposes the immutable tag this run produced.
  publish:
    name: Publish Image
    needs: ci
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy to Production
    needs: [ci, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      PORT: ${{ vars.PORT || '3002' }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate deploy configuration
        run: |
          set -euo pipefail
          for name in IMAGE_TAG DEPLOY_PATH SSH_HOST SSH_PORT SSH_USER PORT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deploy configuration: ${name}"
              exit 1
            fi
          done
          echo "Deploying ${IMAGE_REPOSITORY}:${IMAGE_TAG} to ${DEPLOY_PATH}"

      - name: Prepare SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The compose file is CI-owned and re-synced every deploy. The env file
      # beside it is operator-owned; nothing here writes or deletes it.
      - name: Sync compose file
        run: |
          set -euo pipefail
          ssh $SSH_OPTIONS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -P "$SSH_PORT" \
            docker/compose.yml "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/compose.yml"

      - name: Pull, replace, verify, prune
        run: |
          ssh $SSH_OPTIONS -p "$SSH_PORT" \
            "IMAGE_TAG='$IMAGE_TAG' IMAGE_REPOSITORY='$IMAGE_REPOSITORY' IMAGE_SOURCE='$IMAGE_SOURCE' DEPLOY_PATH='$DEPLOY_PATH' PORT='$PORT' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          fail() {
            printf '::error::%s\n' "$*" >&2
            exit 1
          }

          cd "$DEPLOY_PATH" || fail "missing deploy directory: $DEPLOY_PATH"
          [ -f compose.yml ] || fail "compose.yml was not synced"
          [ -f .env ] || fail "missing operator-owned env file: $DEPLOY_PATH/.env"

          mode="$(stat -c '%a' .env)"
          [ "$mode" = "600" ] || fail "$DEPLOY_PATH/.env must be mode 600, found $mode"

          # deploy_doc is not in the docker group: that is an implicit root
          # grant. The narrow sudoers rule allows exactly this binary instead.
          DOCKER=(sudo -n /usr/bin/docker)
          "${DOCKER[@]}" version >/dev/null 2>&1 ||
            fail "deploy user cannot run docker; add the NOPASSWD /usr/bin/docker rule"

          # sudo resets the environment, so the compose variables live in a
          # CI-owned file rather than being passed through the shell.
          printf 'IMAGE_TAG=%s\nPORT=%s\n' "$IMAGE_TAG" "$PORT" > .image.env
          chmod 644 .image.env
          COMPOSE=("${DOCKER[@]}" compose --env-file .image.env)

          # The registry credential is the run's short-lived token, and it is
          # removed even when a later stage fails.
          logout() {
            "${DOCKER[@]}" logout ghcr.io >/dev/null 2>&1 || true
          }
          trap logout EXIT

          echo "Logging in to ghcr.io as $GHCR_USER"
          printf '%s' "$GHCR_TOKEN" |
            "${DOCKER[@]}" login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null ||
            fail "registry login failed"

          echo "Pulling $IMAGE_REPOSITORY:$IMAGE_TAG"
          if ! "${COMPOSE[@]}" pull; then
            fail "pull failed; the running container is untouched"
          fi

          previous_image="$("${DOCKER[@]}" inspect --format '{{.Config.Image}}' zapi-docs 2>/dev/null || true)"
          previous_tag="${previous_image##*:}"
          echo "Previous tag: ${previous_tag:-none}"

          echo "Replacing the running container with $IMAGE_TAG"
          if ! "${COMPOSE[@]}" up --detach --wait --wait-timeout 90; then
            "${COMPOSE[@]}" logs --tail 100 zapi-docs || true
            if [ -n "$previous_tag" ] && [ "$previous_tag" != "$IMAGE_TAG" ]; then
              echo "New container is unhealthy; restoring $previous_tag"
              printf 'IMAGE_TAG=%s\nPORT=%s\n' "$previous_tag" "$PORT" > .image.env
              "${COMPOSE[@]}" up --detach --wait --wait-timeout 90 || true
            fi
            fail "container did not become healthy; deploy failed"
          fi

          # Health is a contract, not a container-state detail: speak HTTP to it.
          body=""
          for _ in $(seq 1 30); do
            body="$(curl --silent --max-time 5 "http://127.0.0.1:${PORT}/api/health" || true)"
            [ "$body" = '{"status":"ok"}' ] && break
            sleep 1
          done
          [ "$body" = '{"status":"ok"}' ] || fail "GET /api/health returned '${body}', expected '{\"status\":\"ok\"}'"

          echo "Pruning images older than seven days"
          "${DOCKER[@]}" image prune --all --force \
            --filter "until=168h" \
            --filter "label=org.opencontainers.image.source=$IMAGE_SOURCE" >/dev/null || true

          echo "Live tag: $IMAGE_TAG"
          REMOTE
