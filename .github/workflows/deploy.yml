name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Published image tag to deploy instead of this run's build, for
          rolling back (for example sha-1a2b3c4). Leave empty for a normal
          deploy.
        required: false
        type: string
        default: ""

permissions:
  contents: read

# A deploy is a sequence of remote mutations; never cancel one halfway.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Checks
    # A rollback deploys an image that was already built and verified when its
    # tag was published. Rebuilding it adds minutes to an incident and cannot
    # change the result.
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Publishing lives in its own reusable workflow so the image pipeline can
  # change without touching the deploy. The call is gated on the checks and
  # exposes the immutable tag this run produced.
  publish:
    name: Publish Image
    needs: ci
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy to Production
    needs: [ci, publish]
    # Run after a successful pipeline, or for a dispatch that names the tag to
    # roll back to. A failed check or publish must never reach production.
    if: >-
      ${{ !cancelled() && (needs.publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      REQUESTED_TAG: ${{ inputs.image_tag }}
      BUILT_TAG: ${{ needs.publish.outputs.image_tag }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      PORT: ${{ vars.PORT || '3002' }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The image to deploy is either the one this run published or the tag the
      # operator named. The input is never a suggestion: a dispatch carrying a
      # tag always deploys that tag, and a dispatch carrying nothing deploys
      # this run's build.
      - name: Resolve image tag
        run: bash ./scripts/deploy/resolve-image.sh

      - name: Validate deploy configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash ./scripts/deploy/validate-config.sh

      - name: Prepare SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash ./scripts/deploy/prepare-ssh.sh

      # The compose file is CI-owned and re-synced every deploy. The env file
      # beside it is operator-owned; nothing here writes or deletes it.
      - name: Sync compose file
        run: |
          set -euo pipefail
          bash ./scripts/deploy/connection.sh run "mkdir -p '$DEPLOY_PATH'"
          bash ./scripts/deploy/connection.sh copy docker/compose.yml "$DEPLOY_PATH/compose.yml"

      # The registry token is staged as a file so it never appears in a
      # process list on the server. The remote script deletes it after login.
      - name: Stage registry token
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/ghcr-token' EXIT
          umask 077
          printf '%s' "$GHCR_TOKEN" > /tmp/ghcr-token
          bash ./scripts/deploy/connection.sh copy /tmp/ghcr-token "$DEPLOY_PATH/.ghcr-token"
          rm -f /tmp/ghcr-token

      - name: Pull, replace, verify, prune
        run: |
          set -euo pipefail
          bash ./scripts/deploy/bundle.sh | bash ./scripts/deploy/connection.sh run \
            "IMAGE_TAG='$IMAGE_TAG' IMAGE_REPOSITORY='$IMAGE_REPOSITORY' IMAGE_SOURCE='$IMAGE_SOURCE' DEPLOY_PATH='$DEPLOY_PATH' PORT='$PORT' GHCR_USER='$GHCR_USER' bash -s"

      - name: Report the live tag
        run: |
          echo "::notice title=Live tag::${IMAGE_TAG} is serving production"
          {
            echo "### Deployed"
            echo ""
            echo "\`${IMAGE_REPOSITORY}:${IMAGE_TAG}\` is live and healthy."
          } >> "$GITHUB_STEP_SUMMARY"

      # A cancelled or failed run must not leave the staged token behind. This
      # runs after every outcome, including cancellation, and is best-effort:
      # it warns and exits 0 so cleanup cannot replace the real conclusion.
      - name: Remove staged registry token
        if: ${{ always() }}
        continue-on-error: true
        run: bash ./scripts/deploy/cleanup-token.sh
