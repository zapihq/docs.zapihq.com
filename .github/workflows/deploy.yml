name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.17.0"
  APP_NAME: zapi-docs
  SSH_OPTIONS: "-i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts"

jobs:
  ci:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Publishes the image only after the checks pass, so a red commit never
  # produces a tag.
  build-push:
    name: Publish Image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image name and tags
        id: image
        run: |
          # GHCR requires a lowercase repository name.
          name="ghcr.io/${GITHUB_REPOSITORY,,}"

          # The immutable tag is derived from the commit, so an image can always
          # be traced back to the source that produced it.
          sha_tag="sha-$(git rev-parse --short=7 HEAD)"
          tags="${name}:${sha_tag}"

          # `latest` tracks main only. A manual dispatch may publish the commit
          # it runs on, but it must not move the moving tag to another ref.
          on_main=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            on_main=true
            tags="${tags}"$'\n'"${name}:latest"
          fi

          {
            echo "name=${name}"
            echo "sha_tag=${sha_tag}"
            echo "on_main=${on_main}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The run's own short-lived token; no long-lived registry secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the package is private
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          ON_MAIN: ${{ steps.image.outputs.on_main }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          # 1. An anonymous pull must fail. A credential-less attempt is only
          #    able to pull when the package is public, so success here means
          #    the package visibility drifted and the job has to go red.
          docker logout ghcr.io >/dev/null 2>&1 || true
          if anonymous_output="$(docker pull "${IMAGE}:${SHA_TAG}" 2>&1)"; then
            echo "::error::Anonymous pull of ${IMAGE}:${SHA_TAG} succeeded; the package must be private."
            exit 1
          fi
          if ! grep -Eqi 'unauthorized|denied|forbidden' <<<"$anonymous_output"; then
            printf '%s\n' "$anonymous_output" >&2
            echo "::error::Anonymous pull failed for a reason other than authentication."
            exit 1
          fi
          echo "Anonymous pull rejected, as expected."

          # 2. A token-authenticated pull must succeed, proving the published
          #    package is usable by the deploy job without any other secret.
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
          docker pull "${IMAGE}:${SHA_TAG}" >/dev/null

          # 3. On main, both tags point at the same published image, so
          #    `latest` cannot silently lag behind the immutable commit tag.
          sha_digest="$(docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" --format '{{.Manifest.Digest}}')"
          if [ "$ON_MAIN" = "true" ]; then
            latest_digest="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')"
            if [ "$sha_digest" != "$latest_digest" ]; then
              echo "::error::latest (${latest_digest}) does not match ${SHA_TAG} (${sha_digest})."
              exit 1
            fi
          fi

          # 4. The image records the commit that produced it, so any tag can be
          #    traced back to a revision without guessing.
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE}:${SHA_TAG}")"
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::Image revision label is '${revision}', expected '${GITHUB_SHA}'."
            exit 1
          fi
          echo "Authenticated pull of ${IMAGE}:${SHA_TAG} succeeded; revision ${revision}."

  deploy:
    name: Deploy to Production
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      PORT: ${{ vars.PORT }}
      OPENROUTER_API_KEY: ${{ vars.OPENROUTER_API_KEY }}
      RUNTIME_ENV_FILE: ${{ secrets.RUNTIME_ENV_FILE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Package standalone release
        run: bash ./scripts/deploy/package-release.sh

      - name: Prepare SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash ./scripts/deploy/prepare-ssh.sh

      - name: Validate deploy configuration
        env:
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
        run: bash ./scripts/deploy/validate-config.sh

      - name: Upload release archive
        env:
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: bash ./scripts/deploy/upload-release.sh

      - name: Write runtime environment file
        if: ${{ env.RUNTIME_ENV_FILE != '' || env.PORT != '' }}
        env:
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PORT: ${{ vars.PORT }}
        run: bash ./scripts/deploy/write-runtime-env.sh

      - name: Activate release atomically
        env:
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          KEEP_RELEASES: ${{ vars.KEEP_RELEASES || '5' }}
        run: bash ./scripts/deploy/activate-release.sh
