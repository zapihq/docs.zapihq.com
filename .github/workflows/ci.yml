name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.17.0"

jobs:
  quality:
    name: Lint, Typecheck And Container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Add tests here when a test suite exists
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm types:check

      # The container build runs `pnpm build` inside the builder stage, so a
      # separate runner-side build would only duplicate it. The image is the
      # artifact that ships, and check-container.sh proves it boots and serves.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Cache the image layers so the publish workflow's build reuses the
      # builder stage instead of rebuilding it from source on main.
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          tags: zapi-docs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container seam
        run: bash ./scripts/check-container.sh zapi-docs:ci
