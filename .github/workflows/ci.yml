name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.17.0"

jobs:
  quality:
    name: Lint, Typecheck And Container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Add tests here when a test suite exists
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm types:check

      # The container build runs `pnpm build` inside the builder stage, so a
      # separate runner-side build would only duplicate it. The image is the
      # artifact that ships, and check-container.sh proves it boots and serves.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Cache the image layers so the publish workflow's build reuses the
      # builder stage instead of rebuilding it from source on main.
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          tags: zapi-docs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container seam
        run: bash ./scripts/check-container.sh zapi-docs:ci

  # Temporary: read production state before the container cutover (#34).
  inspect:
    name: Inspect Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Inspect production server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: bash ./scripts/inspect-server.sh

  # Temporary: seed the operator-owned env file once at cutover (#34).
  bootstrap-env:
    name: Bootstrap Env File
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Seed /opt/zapi-docs/.env
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY_BOOTSTRAP }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          ssh_opts=(-i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST")

          if ssh "${ssh_opts[@]}" 'test -f /opt/zapi-docs/.env'; then
            echo "operator .env already exists; leaving it untouched"
          else
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" |
              ssh "${ssh_opts[@]}" 'umask 077; cat > /opt/zapi-docs/.env; chmod 600 /opt/zapi-docs/.env'
            echo "created operator .env"
          fi

          ssh "${ssh_opts[@]}" "stat -c '%a %U:%G %n' /opt/zapi-docs/.env; cut -d= -f1 /opt/zapi-docs/.env"
