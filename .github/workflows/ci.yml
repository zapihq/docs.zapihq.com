name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.17.0"

jobs:
  quality:
    name: Lint, Typecheck And Container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Add tests here when a test suite exists
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm types:check

      # The container build runs `pnpm build` inside the builder stage, so a
      # separate runner-side build would only duplicate it. The image is the
      # artifact that ships, and check-container.sh proves it boots and serves.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Cache the image layers so the publish workflow's build reuses the
      # builder stage instead of rebuilding it from source on main.
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          tags: zapi-docs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container seam
        run: bash ./scripts/check-container.sh zapi-docs:ci

  # Temporary: apply the cutover's GitHub configuration (#34).
  configure:
    name: Configure GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Update deploy variables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          repo="$GITHUB_REPOSITORY"
          base="repos/${repo}/environments/production/variables"

          gh api -X PATCH "${base}/DEPLOY_PATH" -f name=DEPLOY_PATH -f value=/opt/zapi-docs || true
          gh api -X DELETE "${base}/SERVICE_NAME" || true
          gh api -X DELETE "${base}/KEEP_RELEASES" || true
          gh api -X DELETE "${base}/OPENROUTER_API_KEY" || true

          {
            echo "variables:"
            gh api "${base}" --jq '.variables[].name' || true
          } > vars-status.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vars-status.txt
          git commit -m "chore: variables status [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
