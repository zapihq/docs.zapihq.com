name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.17.0"

jobs:
  quality:
    name: Lint, Typecheck, Build And Container
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Add tests here when a test suite exists
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm types:check

      - name: Build
        run: pnpm build

      - name: Build container image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL="https://docs.zapihq.com" \
            --tag zapi-docs:ci \
            .

      - name: Verify container seam
        run: bash ./scripts/check-container.sh zapi-docs:ci
