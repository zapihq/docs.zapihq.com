name: Publish Image

# Called by deploy.yml only after the checks pass, so a red commit never
# produces a tag. Keeping it a reusable workflow means the publish pipeline can
# be read and changed on its own without touching the deploy.
on:
  workflow_call:
    outputs:
      image:
        description: Image repository without a tag
        value: ${{ jobs.build-push.outputs.image }}
      image_tag:
        description: Immutable tag published by this run
        value: ${{ jobs.build-push.outputs.image_tag }}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The site URL is an environment variable. A job only sees it when it
    # targets the environment, and without it `vars` falls through to the
    # organization default, which is the marketing site, not the docs site.
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      image_tag: ${{ steps.image.outputs.sha_tag }}
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image name and tags
        id: image
        run: |
          # GHCR requires a lowercase repository name.
          name="ghcr.io/${GITHUB_REPOSITORY,,}"

          # The immutable tag is derived from the commit, so an image can always
          # be traced back to the source that produced it.
          sha_tag="sha-$(git rev-parse --short=7 HEAD)"
          tags="${name}:${sha_tag}"

          # `latest` tracks main only. A manual dispatch may publish the commit
          # it runs on, but it must not move the moving tag to another ref.
          on_main=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            on_main=true
            tags="${tags}"$'\n'"${name}:latest"
          fi

          {
            echo "name=${name}"
            echo "sha_tag=${sha_tag}"
            echo "on_main=${on_main}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The run's own short-lived token; no long-lived registry secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      # A `sha-*` tag is immutable. Re-running a commit must reuse the image
      # that tag already names, not overwrite it with a new digest; otherwise
      # an idempotent deploy would recreate the running container.
      - name: Check whether the immutable tag already exists
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${SHA_TAG} already exists; skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the package is private
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          ON_MAIN: ${{ steps.image.outputs.on_main }}
          EXISTING: ${{ steps.existing.outputs.exists }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          # 1. An anonymous pull must fail. A credential-less attempt is only
          #    able to pull when the package is public, so success here means
          #    the package visibility drifted and the job has to go red.
          docker logout ghcr.io >/dev/null 2>&1 || true
          if anonymous_output="$(docker pull "${IMAGE}:${SHA_TAG}" 2>&1)"; then
            echo "::error::Anonymous pull of ${IMAGE}:${SHA_TAG} succeeded; the package must be private."
            exit 1
          fi
          if ! grep -Eqi 'unauthorized|denied|forbidden' <<<"$anonymous_output"; then
            printf '%s\n' "$anonymous_output" >&2
            echo "::error::Anonymous pull failed for a reason other than authentication."
            exit 1
          fi
          echo "Anonymous pull rejected, as expected."

          # 2. A token-authenticated pull must succeed, proving the published
          #    package is usable by the deploy job without any other secret.
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
          docker pull "${IMAGE}:${SHA_TAG}" >/dev/null

          # 3. On main, a freshly built image also moves `latest`, so the two
          #    tags cannot silently diverge. A reused immutable tag leaves
          #    `latest` where it is; the deploy never references it.
          sha_digest="$(docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" --format '{{.Manifest.Digest}}')"
          if [ "$ON_MAIN" = "true" ] && [ "$EXISTING" != "true" ]; then
            latest_digest="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')"
            if [ "$sha_digest" != "$latest_digest" ]; then
              echo "::error::latest (${latest_digest}) does not match ${SHA_TAG} (${sha_digest})."
              exit 1
            fi
          fi

          # 4. The image records the commit that produced it, so any tag can be
          #    traced back to a revision without guessing.
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE}:${SHA_TAG}")"
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::Image revision label is '${revision}', expected '${GITHUB_SHA}'."
            exit 1
          fi
          echo "Authenticated pull of ${IMAGE}:${SHA_TAG} succeeded; revision ${revision}."

      # Retention: the registry keeps the newest 20 immutable `sha-*` versions
      # plus the version carrying `latest`, so neither the package nor the
      # rollback window grows without bound. This runs after the new tag has
      # been verified, so a failed build or a package whose visibility drifted
      # never triggers a delete. Re-running an already-published tag skips it:
      # nothing new was added, so an idempotent run does not mutate the package.
      #
      # Only versions whose tags are all `sha-*` are deleted by tag. A version
      # carrying a manual tag is left alone. Untagged versions are deleted only
      # when they are older than the oldest kept version: buildx attaches
      # untagged provenance/attestation manifests per pushed image, and those
      # share their parent's creation time, so a kept image keeps its children.
      - name: Prune old package versions
        # Housekeeping must never block a deploy: a registry hiccup or a
        # permissions change turns this step red, not production.
        if: ${{ steps.existing.outputs.exists != 'true' }}
        continue-on-error: true
        env:
          OWNER: ${{ github.repository_owner }}
          KEEP_SHA_VERSIONS: "20"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # GHCR names the package after the repository, lowercased.
          package="${GITHUB_REPOSITORY#*/}"
          package="${package,,}"

          # The package API is under /orgs for an organization owner and under
          # /users for a user owner. Read the owner's type instead of assuming.
          owner_type="$(gh api "/users/${OWNER}" --jq .type)"
          if [ "$owner_type" = "Organization" ]; then
            versions_url="/orgs/${OWNER}/packages/container/${package}/versions"
          else
            versions_url="/users/${OWNER}/packages/container/${package}/versions"
          fi

          # Fetch every page, then sort by creation time below so retention
          # does not depend on the API's ordering. Each version is one pushed
          # manifest, usually carrying both its sha-* tag and latest.
          versions="$(gh api --paginate "${versions_url}?per_page=100" | jq --slurp 'add // []')"

          stale_ids="$(jq --raw-output --argjson keep "$KEEP_SHA_VERSIONS" '
            def tags: .metadata.container.tags // [];
            def is_sha_version: any(tags[]; startswith("sha-"));
            def only_sha_tags: length > 0 and all(.[]; startswith("sha-"));

            . as $all
            | [ $all[] | select((tags | length) > 0) ] as $tagged
            | ([ $tagged[] | select(any(tags[]; . == "latest")) | .id ]) as $latest
            | ([ $tagged[]
                 | select(is_sha_version)
                 | . ] | sort_by(.created_at) | reverse | .[:$keep] | [ .[].id ]) as $recent
            | ($latest + $recent) as $keep_ids
            | ([ $tagged[]
                 | select(.id as $id | ($keep_ids | index($id)))
                 | .created_at ] | min) as $oldest_kept
            | ( [ $tagged[]
                  | select(.id as $id | ($keep_ids | index($id)) | not)
                  | select(tags | only_sha_tags)
                  | .id ]
                + [ $all[]
                    | select((tags | length) == 0)
                    | select(.created_at < $oldest_kept)
                    | .id ] )
            | .[]
          ' <<<"$versions")"

          if [ -z "$stale_ids" ]; then
            echo "Nothing to prune: no version is older than the newest ${KEEP_SHA_VERSIONS} sha-* versions."
            exit 0
          fi

          # Keep deleting after one failure, so a single bad version does not
          # leave every older one in place. The step still ends red, which is
          # visible on a deploy that otherwise stays green.
          pruned=0
          failed=0
          while IFS= read -r version_id; do
            [ -n "$version_id" ] || continue
            if gh api --method DELETE "${versions_url}/${version_id}" >/dev/null; then
              pruned=$((pruned + 1))
            else
              echo "::warning::Could not delete package version ${version_id}; a publish that builds a new version retries it."
              failed=$((failed + 1))
            fi
          done <<<"$stale_ids"
          echo "Pruned ${pruned} old package version(s); kept ${KEEP_SHA_VERSIONS} sha-* versions plus latest."
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
